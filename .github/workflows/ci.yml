name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update

  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ruby
          # Default suite is high-precision security only. security-and-quality adds
          # the extended security queries plus maintainability/reliability queries
          # (dead code, unused assignments, correctness smells).
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3

  test:
    needs: [security, analyze]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Upload coverage report
        if: always() && matrix.ruby-version == '3.4'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
